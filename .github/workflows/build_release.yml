name: Build & Release Custom Patches

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate Manager metadata
        run: |
          python3 -B scripts/letasu/metadata.py
          python3 -B -m unittest discover -s tests/release -v

      - name: Test Smart Audio Focus
        run: python3 tests/audiofocus/run_tests.py --java-home "$JAVA_HOME"

      - name: Build Patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon

      - name: Validate generated patch list
        run: python3 -B scripts/letasu/metadata.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: morphe-custom-patches
          path: |
            patches/build/libs/*.mpp
            patches-bundle.json
            patches-list.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            patches/build/libs/*.mpp
            patches-bundle.json
            patches-list.json
